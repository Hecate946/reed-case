name: OpenSCAD validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSCAD
        run: sudo apt-get update && sudo apt-get install -y openscad xvfb
      - name: Compile model
        run: make check
      - name: Export case and fit coupon
        run: make export-case export-fit